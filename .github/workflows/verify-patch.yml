name: Verify the patch applies

# The patch is anchored to text in upstream's files, so it rots silently when
# upstream edits them. This proves it still applies against the current
# release AND the default branch, so a breaking change surfaces before it
# reaches a release rather than at 6am on build day.
on:
    push:
        branches: [main]
    pull_request:
    schedule:
        - cron: "0 5 * * *"
    workflow_dispatch:

permissions:
    contents: read

env:
    UPSTREAM: rivenmedia/riven

jobs:
    unit:
        name: Uncached-request tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.13"
            # Runs against the patch's own module with upstream stubbed, so it
            # needs no checkout and covers the one thing a diff cannot show by
            # eye: that the feature is genuinely inert when switched off.
            - run: python3 test/test_uncached.py

    apply:
        name: Apply to ${{ matrix.ref }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                ref: [newest-tag, main]
        steps:
            - uses: actions/checkout@v4
              with:
                  path: patchsrc

            - name: Resolve the ref
              id: pick
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  if [ "${{ matrix.ref }}" = "newest-tag" ]; then
                    # Matches the build workflow: releases are stale and the
                    # newest one cannot even be built. See the comment there.
                    REF=$(gh api "repos/${UPSTREAM}/tags?per_page=15" --jq '.[].name' \
                          | while read -r t; do
                              d=$(gh api "repos/${UPSTREAM}/commits/$t" --jq '.commit.committer.date' 2>/dev/null) || continue
                              echo "$d $t"
                            done | sort -r | head -1 | cut -d' ' -f2)
                  else
                    REF=$(gh api "repos/${UPSTREAM}" --jq .default_branch)
                  fi
                  echo "ref=$REF" >> "$GITHUB_OUTPUT"
                  echo "resolved to $REF"

            - uses: actions/checkout@v4
              with:
                  repository: ${{ env.UPSTREAM }}
                  ref: ${{ steps.pick.outputs.ref }}
                  path: upstream

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.13"

            - name: Apply
              working-directory: upstream
              run: node ../patchsrc/patch/apply.mjs

            - name: The patch must be idempotent
              working-directory: upstream
              run: |
                  set -euo pipefail
                  node ../patchsrc/patch/apply.mjs | tee second.log
                  # Re-applying must change nothing. "copied" is expected --
                  # the provider file is overwritten every run by design --
                  # but any "patched" line means an edit is not detecting its
                  # own previous application and will duplicate itself.
                  if grep -q "^  patched " second.log; then
                    echo "::error::apply.mjs is not idempotent"
                    exit 1
                  fi
                  rm second.log

            - name: It must actually import
              working-directory: upstream
              run: |
                  set -euo pipefail
                  python3 -m py_compile \
                    src/program/services/downloaders/torbox.py \
                    src/program/settings/models.py \
                    src/program/services/downloaders/__init__.py

                  # TorBox must be a real field on DownloadersModel, not just a
                  # class sitting unreferenced in the file. The settings form
                  # is generated from this schema, so a missing field means the
                  # provider is unconfigurable no matter what else applied.
                  python3 - <<'PY'
                  import ast
                  tree = ast.parse(open("src/program/settings/models.py").read())
                  fields = []
                  for node in ast.walk(tree):
                      if isinstance(node, ast.ClassDef) and node.name == "DownloadersModel":
                          fields = [t.target.id for t in node.body if isinstance(t, ast.AnnAssign)]
                  assert "torbox" in fields, f"torbox missing from DownloadersModel: {fields}"
                  print("DownloadersModel carries torbox:", fields)
                  PY

                  grep -q "TorBoxDownloader: TorBoxDownloader()" src/program/services/downloaders/__init__.py

                  # The add_torrent fallback must be present, or downloading is
                  # broken for every provider: the bare `assert torrent_id`
                  # fires with an empty message, every cached stream is
                  # blacklisted, and items sit at Indexed while the log shows a
                  # successful scrape.
                  grep -q "no torrent id on the container" src/program/services/downloaders/__init__.py
                  grep -q "service.add_torrent(stream.infohash)" src/program/services/downloaders/__init__.py

                  # The uncached path must stay behind its guard. If an edit
                  # ever lands it unguarded, the feature would change the
                  # downloader's behaviour for everyone, which is the one thing
                  # it promises not to do.
                  grep -q "uncached_requests.enabled()" src/program/services/downloaders/__init__.py
                  test "$(grep -c 'uncached_requests.enabled()' src/program/services/downloaders/__init__.py)" -ge 2

                  # UserInfo.service must ACCEPT "torbox". This is a runtime
                  # pydantic Literal, so py_compile and an import check both
                  # pass while the provider fails on first use: get_user_info
                  # raises a validation error, _validate_premium fails, and
                  # Riven reports "No Downloader service initialized" with the
                  # real cause buried several lines up. Found by deploying,
                  # which is exactly the feedback loop this check replaces.
                  python3 - <<'PY'
                  import ast
                  tree = ast.parse(open("src/program/services/downloaders/models.py").read())
                  lit = None
                  for node in ast.walk(tree):
                      if isinstance(node, ast.ClassDef) and node.name == "UserInfo":
                          for stmt in node.body:
                              if isinstance(stmt, ast.AnnAssign) and getattr(stmt.target, "id", None) == "service":
                                  lit = [e.value for e in stmt.annotation.slice.elts]
                  assert lit and "torbox" in lit, f"UserInfo.service does not accept torbox: {lit}"
                  print("UserInfo.service accepts:", lit)
                  PY

                  echo "verified"
